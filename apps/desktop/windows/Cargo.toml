[workspace]
members = [
    "src-tauri",
    "crates/domain",
    "crates/storage",
    "crates/secrets",
    "crates/ssh-core",
    "crates/sftp-core",
    "crates/monitor",
    "crates/execution",
    "crates/ai-client",
    "crates/automation",
    "crates/sync",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
sparrowshell-domain = { path = "crates/domain" }
sparrowshell-storage = { path = "crates/storage" }
sparrowshell-secrets = { path = "crates/secrets" }
sparrowshell-ssh-core = { path = "crates/ssh-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
